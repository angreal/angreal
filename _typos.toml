# Spell-check configuration (crate-ci/typos).
# The API reference pages are rendered by Plissken from Rust/PyO3 source (not
# in git) and are not authored prose, so they are excluded from spell checking,
# as are the npm lockfile and the built site.
[files]
extend-exclude = [
  "docs/src/content/docs/reference/api",
  "docs/package-lock.json",
  "docs/node_modules",
  "docs/dist",
]
